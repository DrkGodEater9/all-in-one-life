<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Personal OS">
  <!--
    iOS aplica su propio recorte de esquinas redondeadas, así que el fondo
    llena todo el cuadrado sin transparencia (Safari ignora la transparencia
    en apple-touch-icon y la pinta de negro).
  -->
  <rect width="512" height="512" fill="#0F0F11"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#7C6AF7" stroke-width="32"/>
  <circle cx="256" cy="256" r="64" fill="#7C6AF7"/>
</svg>
