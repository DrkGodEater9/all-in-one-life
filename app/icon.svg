<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Personal OS">
  <!--
    Marca de Personal OS: una retícula tipo "bento" (una celda alta + dos
    apiladas), que es literalmente la forma del dashboard de la app.
    Geometría simple a propósito: a 16px en la pestaña del navegador
    cualquier detalle fino se convierte en ruido, y una letra se vuelve
    ilegible. Fondo violeta sólido (el acento del sistema) para que
    contraste igual de bien en pestañas claras y oscuras.
  -->
  <rect width="512" height="512" rx="112" fill="#7C6AF7"/>
  <g fill="#FFFFFF">
    <rect x="120" y="120" width="124" height="272" rx="30"/>
    <rect x="268" y="120" width="124" height="124" rx="30"/>
    <rect x="268" y="268" width="124" height="124" rx="30"/>
  </g>
</svg>
